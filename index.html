<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview" 
             alt="Stylized Landscape" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388272/styled.jpg" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="Big Cat in the Wild" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388272/bigcat.jpg" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="Blue Mountains" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388272/blue.jpg" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">
    </div>

    <script src="gallery.js"></script>
</body>
</html>
